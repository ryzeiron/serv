# Configuration MarketEconomy

# Interval en secondes entre chaque recalcul des prix (base sur les transactions recentes)
price-update-interval: 60

# Sensibilite du marche : plus la valeur est haute, plus les prix bougent vite
market-sensitivity: 0.02

# Sensibilite de la correlation entre items d'une meme categorie (effet plus subtil que market-sensitivity)
category-sensitivity: 0.01

# Marge minimale et maximale par rapport au prix de base (evite les prix a 0 ou infinis)
min-price-multiplier: 0.2
max-price-multiplier: 5.0

# Nombre de points d'historique de prix conserves par item (pour /market graphique)
price-history-length: 50

# Evenements de marche aleatoires (krachs / ruees) qui secouent une categorie ou tout le marche
events:
  enabled: true
  # Chance (0.0 a 1.0) de declencher un evenement a chaque recalcul de prix, si aucun n'est deja actif
  check-chance: 0.05
  # Duree d'un evenement, en nombre de cycles de recalcul de prix
  duration-cycles: 3
  # Choc de prix instantane applique au declenchement (multiplicateur)
  crash-shock: 0.75
  boom-shock: 1.30
  # Multiplicateur de volatilite applique aux items de la categorie touchee pendant l'evenement
  volatility-multiplier: 2.0

# Detection de manipulation de marche (pump and dump) : si un joueur represente
# une trop grosse part du volume d'un item sur un cycle, il est suspendu du trading
manipulation:
  enabled: true
  # Volume total minimum sur un item avant de verifier (evite les faux positifs sur les items peu actifs)
  min-volume: 40
  # Part du volume total (0.0 a 1.0) au-dela de laquelle un joueur est flagge
  share-threshold: 0.6
  # Duree de la suspension du trading, en secondes
  suspension-seconds: 120

# Journal du marche (/journal) : titres generes automatiquement a chaque recalcul de prix
journal:
  # Nombre de titres conserves dans l'historique
  history-length: 30
  # Variation de prix minimale (%) sur un cycle pour generer un titre
  headline-threshold-percent: 3.0

# Contrats a terme (/futures) : parier sur la hausse (long) ou la baisse (short) d'un item
futures:
  min-stake: 10.0
  # 0 = pas de plafond
  max-stake: 0.0
  min-minutes: 2
  max-minutes: 120

# Items disponibles sur le marche au demarrage : materiau, categorie, prix de base, stock initial, nom affiche
