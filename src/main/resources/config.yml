# Configuration MarketEconomy

# Interval en secondes entre chaque recalcul des prix (base sur les transactions recentes)
price-update-interval: 60

# Sensibilite du marche : plus la valeur est haute, plus les prix bougent vite
market-sensitivity: 0.02

# Marge minimale et maximale par rapport au prix de base (evite les prix a 0 ou infinis)
min-price-multiplier: 0.2
max-price-multiplier: 5.0

# Nombre de points d'historique de prix conserves par item (pour /market graphique)
price-history-length: 50

# Items disponibles sur le marche au demarrage : materiau, prix de base, stock initial, nom affiche
items:
  DIAMOND:
    display-name: "Diamant"
    base-price: 100.0
    initial-stock: 500
  EMERALD:
    display-name: "Émeraude"
    base-price: 40.0
    initial-stock: 800
  NETHERITE_INGOT:
    display-name: "Lingot de Netherite"
    base-price: 500.0
    initial-stock: 50
  IRON_INGOT:
    display-name: "Lingot de Fer"
    base-price: 8.0
    initial-stock: 2000
  GOLD_INGOT:
    display-name: "Lingot d'Or"
    base-price: 15.0
    initial-stock: 1200
  WHEAT:
    display-name: "Blé"
    base-price: 2.0
    initial-stock: 5000
  ROTTEN_FLESH:
    display-name: "Chair Pourrie"
    base-price: 0.5
    initial-stock: 5000
