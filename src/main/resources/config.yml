# Configuration MarketEconomy

# Interval en secondes entre chaque recalcul des prix (base sur les transactions recentes)
price-update-interval: 60

# Sensibilite du marche : plus la valeur est haute, plus les prix bougent vite
market-sensitivity: 0.02

# Sensibilite de la correlation entre items d'une meme categorie (effet plus subtil que market-sensitivity)
category-sensitivity: 0.01

# Marge minimale et maximale par rapport au prix de base (evite les prix a 0 ou infinis)
min-price-multiplier: 0.2
max-price-multiplier: 5.0

# Nombre de points d'historique de prix conserves par item (pour /market graphique)
price-history-length: 50

# Evenements de marche aleatoires (krachs / ruees) qui secouent une categorie ou tout le marche
events:
  enabled: true
  # Chance (0.0 a 1.0) de declencher un evenement a chaque recalcul de prix, si aucun n'est deja actif
  check-chance: 0.05
  # Duree d'un evenement, en nombre de cycles de recalcul de prix
  duration-cycles: 3
  # Choc de prix instantane applique au declenchement (multiplicateur)
  crash-shock: 0.75
  boom-shock: 1.30
  # Multiplicateur de volatilite applique aux items de la categorie touchee pendant l'evenement
  volatility-multiplier: 2.0

# Detection de manipulation de marche (pump and dump) : si un joueur represente
# une trop grosse part du volume d'un item sur un cycle, il est repere (aucun
# blocage automatique) et devient la cible possible d'une prime (/prime <joueur>)
manipulation:
  enabled: true
  # Volume total minimum sur un item avant de verifier (evite les faux positifs sur les items peu actifs)
  min-volume: 40
  # Part du volume total (0.0 a 1.0) au-dela de laquelle un joueur est flagge
  share-threshold: 0.6
  # Duree pendant laquelle un joueur flagge peut etre cible par /prime, en secondes
  bounty-eligible-seconds: 300
  # Part des ventes de la cible reversee au joueur qui a pose la prime (0.0 a 1.0)
  bounty-cut-share: 0.10
  # Duree d'une prime active, en secondes
  bounty-duration-seconds: 1200

# Journal du marche (/journal) : titres generes automatiquement a chaque recalcul de prix
journal:
  # Nombre de titres conserves dans l'historique
  history-length: 30
  # Variation de prix minimale (%) sur un cycle pour generer un titre
  headline-threshold-percent: 3.0

# PNJ marchands avec memoire : chaque villageois commerce selon son metier
# (fermier -> consommables, armurier -> minerais, etc.) et ajuste ses prix selon
# la confiance accumulee (achats reguliers) ou perdue (villageois tues) par joueur
villagers:
  # Score de confiance perdu quand le joueur tue un villageois
  kill-penalty: 25.0
  # Score de confiance gagne a chaque achat/vente avec un villageois
  trade-gain: 1.5
  # Seuils de confiance (0-100)
  trusted-threshold: 80.0
  liked-threshold: 60.0
  weary-threshold: 20.0
  hostile-threshold: 10.0
  # En dessous du seuil hostile, le villageois refuse totalement de commercer
  trusted-discount: 0.10
  liked-discount: 0.05
  weary-markup: 0.10

# Contrats a terme (/futures) : parier sur la hausse (long) ou la baisse (short) d'un item
futures:
  min-stake: 10.0
  # 0 = pas de plafond
  max-stake: 0.0
  min-minutes: 2
  max-minutes: 120

# Metiers (/metier) : progression par xp/niveau, un metier a la fois par joueur
jobs:
  # Xp necessaire pour passer du niveau N au niveau N+1 = xp-per-level-base * N (niveau max 10)
  xp-per-level-base: 100.0
  hacker:
    # /hack market <item> : rapport d'initie sur la pression de prix du cycle en cours
    insider-cooldown-seconds: 20
    xp-insider: 5.0
    # /hack price <item> <up|down> : injecte une fausse activite pour pousser le prix.
    # Se comporte comme une vraie manipulation (detectable) sauf trace brouillee juste avant
    price-hack-cooldown-seconds: 300
    price-hack-cost: 200.0
    price-hack-fake-volume-base: 60
    price-hack-fake-volume-per-level: 10
    xp-price-hack: 15.0
    # /hack scramble : immunise temporairement contre la detection de manipulation
    scramble-cooldown-seconds: 600
    scramble-cost: 150.0
    scramble-duration-seconds: 300
    xp-scramble: 10.0
    # /hack wiretap <joueur> : intercepte un % des ventes (marche + villageois) de la cible
    wiretap-cooldown-seconds: 900
    wiretap-cost: 300.0
    wiretap-duration-seconds: 180
    wiretap-cut-base: 0.05
    wiretap-cut-per-level: 0.01
    wiretap-cut-max: 0.15
    # Chance (0.0-1.0) d'etre repere a chaque vente interceptee (rend le hacker primable)
    wiretap-catch-chance-base: 0.30
    wiretap-catch-chance-per-level: 0.02
    wiretap-catch-chance-min: 0.05
    # Delai avant de pouvoir re-cibler la meme victime, en secondes
    wiretap-target-cooldown-seconds: 1800
    xp-wiretap-start: 20.0
    # /hack banque <joueur> : tente de pirater la banque d'ile de la cible
    bank-hack-cooldown-seconds: 2700
    bank-hack-target-cooldown-seconds: 10800
    bank-hack-cost: 500.0
    bank-hack-chance-base: 0.40
    bank-hack-chance-per-level: 0.05
    bank-hack-chance-max: 0.85
    # Part du solde bancaire volee en cas de reussite
    bank-hack-drain-share: 0.30
    xp-bank-hack-success: 60.0
    # /hack terminal : mini-jeu (grille 3x3, 3 essais) contre du loot
    terminal-cooldown-seconds: 180
    terminal-reward-base: 50.0
    terminal-reward-per-level: 15.0
    xp-terminal-success: 40.0
    xp-terminal-fail: 10.0

