name: MarketEconomy
version: '1.0.0'
main: com.antonin.marketeconomy.MarketEconomyPlugin
api-version: '1.21'
author: Antonin
description: Economie de marche dynamique (offre/demande) pour serveurs Minecraft
softdepend: [Vault]

commands:
  market:
    description: Ouvre l'interface du marche
    usage: /market
    aliases: [marche, bourse]
  sell:
    description: Vend l'item tenu en main sur le marche
    usage: /sell <quantite>
  buy:
    description: Achete un item sur le marche
    usage: /buy <item> <quantite>
  journal:
    description: Recoit la derniere edition du journal du marche
    usage: /journal
    aliases: [gazette]
  futures:
    description: Contrats a terme sur le marche (parier sur la tendance)
    usage: /futures <long|short|list> [item] [montant] [minutes]
    aliases: [contrat]
  marketitem:
    description: Obtenir des items speciaux du marche (boussole, graine speculative)
    usage: /marketitem <boussole|graine> [montant] [minutes]
    permission: marketeconomy.use
  prime:
    description: Place une prime sur un joueur repere pour manipulation de marche
    usage: /prime <joueur>
    permission: marketeconomy.use
  spawn:
    description: Teleporte au spawn du serveur
    usage: /spawn
    permission: marketeconomy.use
  pvp:
    description: Teleporte sur l'ile PvP
    usage: /pvp
    permission: marketeconomy.use
  ile:
    description: Teleporte sur ton ile personnelle (la cree si besoin)
    usage: /ile
    aliases: [island]
    permission: marketeconomy.use
  sethub:
    description: Enregistre ta position actuelle comme spawn du serveur
    usage: /sethub
    permission: marketeconomy.admin
  setpvp:
    description: Enregistre ta position actuelle comme ile PvP
    usage: /setpvp
    permission: marketeconomy.admin
  marketadmin:
    description: Commandes admin (suppression de zone/structure)
    usage: /marketadmin clearzone <tailleX> <tailleY> <tailleZ> [confirm]
    permission: marketeconomy.admin
  metier:
    description: Choisis ou consulte ton metier
    usage: /metier [hacker]
    aliases: [job]
    permission: marketeconomy.use
  banque:
    description: Banque d'ile (depot/retrait a l'abri de ta poche)
    usage: /banque <solde|deposer|retirer> [montant]
    permission: marketeconomy.use
  hack:
    description: Capacites du metier Hacker
    usage: /hack <market|price|scramble|wiretap|banque|terminal> [args]
    permission: marketeconomy.use

permissions:
  marketeconomy.use:
    description: Autorise l'utilisation du marche
    default: true
  marketeconomy.admin:
    description: Autorise l'administration du marche
    default: op
